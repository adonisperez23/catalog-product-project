name: Deploy to S3
run-name: deploying changes
on:
  push:
    branches:
      - master # O la rama que prefieras para producción

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10 # Puedes especificar la versión que usas localmente

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22' # Asegúrate de usar la versión que maneja tu proyecto
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Generate static files
        run: pnpm run generate

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2 # Cambia esto a tu región de S3

      - name: Deploy to S3
        run: |
          aws s3 sync .output/public s3://${{ secrets.AWS_S3_BUCKET }} --delete

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} --paths "/*"